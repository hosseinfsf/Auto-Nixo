name: nixo_ui
description: NIXO LITE Flutter desktop UI.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  nixo_core:
    path: ../../packages/core
  http: ^1.2.0
  provider: ^6.1.0
  flutter_localizations:
    sdk: flutter
  intl: any
  window_manager: ^0.4.0
  flutter_secure_storage: ^9.2.0
  fl_chart: ^0.68.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^4.0.0

flutter:
  uses-material-design: true
