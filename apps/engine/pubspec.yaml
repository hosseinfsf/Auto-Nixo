  shelf: ^1.4.0
  shelf_router: ^1.1.0
  web_socket_channel: ^2.4.0
  crypto: ^3.0.0
  ffi: ^2.1.0
  image: ^4.2.0
  args: ^2.4.0

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
