name: CI

on:
  push:
  pull_request:

jobs:
  # ---- Dart: packages/core ----
  core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: pub get
        working-directory: packages/core
        run: dart pub get 2>&1 | Tee-Object -FilePath core_pubget.log
      - name: analyze
        working-directory: packages/core
        run: dart analyze 2>&1 | Tee-Object -FilePath core_analyze.log
      - name: test
        working-directory: packages/core
        run: dart test 2>&1 | Tee-Object -FilePath core_test.log
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-logs
          path: |
            packages/core/core_pubget.log
            packages/core/core_analyze.log
            packages/core/core_test.log
          if-no-files-found: ignore

  # ---- Dart: apps/engine ----
  engine:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: pub get
        working-directory: apps/engine
        run: dart pub get 2>&1 | Tee-Object -FilePath engine_pubget.log
      - name: analyze
        working-directory: apps/engine
        run: dart analyze 2>&1 | Tee-Object -FilePath engine_analyze.log
      - name: test
        working-directory: apps/engine
        run: dart test 2>&1 | Tee-Object -FilePath engine_test.log
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-logs
          path: |
            apps/engine/engine_pubget.log
            apps/engine/engine_analyze.log
            apps/engine/engine_test.log
          if-no-files-found: ignore

  # ---- Flutter: apps/ui ----
  ui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: pub get
        working-directory: apps/ui
        run: flutter pub get 2>&1 | Tee-Object -FilePath ui_pubget.log
      - name: analyze
        working-directory: apps/ui
        run: flutter analyze 2>&1 | Tee-Object -FilePath ui_analyze.log
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-logs
          path: |
            apps/ui/ui_pubget.log
            apps/ui/ui_analyze.log
          if-no-files-found: ignore

  # ---- Secret scan (gitleaks) ----
  secretscan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
